    <!-- منو -->

    <a

<main>


  <!-- معرفی برند -->

  <section class="page-head">

    <div class="container">

      <div class="brand-header">

        <img
          id="brandLogo"
          class="brand-header-logo"
          src="../assets/logo.png"
          alt="برند"
        >

        <div class="brand-header-info">

          <span class="kicker">
            BRAND PRODUCTS

          <h1 id="brandName">

          </p>

  </section>



  <!-- محصولات -->

  <section class="section">

    <div class="container">


      <div class="section-head">

        <div>

          <span class="kicker">

            محصولات این برند
          </h2>

      </div>


      <div
        id="productsGrid"

      >

          در حال دریافت محصولات...
        </div>

<footer>

  <div class="container footer-flex">

    <div>

      <b>
        هایپر باتری ماهر
      </b>

      · باتری اسلامشهر

    </div>


    <div>

      اسلامشهر، خیابان گلها، نبش البرز ۷

    </div>


    <div>

      ©
      <span id="year"></span>

    </div>

  </div>

</footer>



<script>


/* -----------------------------
   اتصال به Supabase
----------------------------- */

const cfg =
  window.SUPABASE_CONFIG || {};


const SB =
  window.supabase.createClient(
    cfg.url,
    cfg.anonKey
  );



/* -----------------------------
   ابزار امن برای نمایش متن
----------------------------- */

const esc = value =>

  String(value ?? "")
    .replace(
      /[&<>"']/g,

      char => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char])

    );



/* -----------------------------
   قیمت
----------------------------- */

function money(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "استعلام قیمت";

  }


  const number =
    Number(value);


  if (Number.isFinite(number)) {

    return new Intl.NumberFormat("fa-IR")
      .format(number)
      + " تومان";

  }


  return esc(value);

}



/* -----------------------------
   شناسه برند از آدرس
----------------------------- */

const params =
  new URLSearchParams(
    window.location.search
  );


const brandId =
  params.get("id");



/* -----------------------------
   دریافت برند و محصولات
----------------------------- */

async function loadBrand() {


  const brandName =
    document.getElementById(
      "brandName"
    );


  const brandDescription =
    document.getElementById(
      "brandDescription"
    );


  const brandLogo =
    document.getElementById(
      "brandLogo"
    );


  const productsGrid =
    document.getElementById(
      "productsGrid"
    );


  /* اگر شناسه وجود نداشت */

  if (!brandId) {

    brandName.textContent =
      "برند پیدا نشد";

    brandDescription.textContent =
      "شناسه برند مشخص نشده است.";

    productsGrid.innerHTML =
      '<div class="empty">برند نامعتبر است.</div>';

    return;

  }



  /* -----------------------------
     دریافت اطلاعات برند
  ----------------------------- */

  const brandResult =
    await SB

      .from("brands")

      .select("*")

      .eq("id", brandId)

      .eq("active", true)

      .single();



  if (
    brandResult.error ||
    !brandResult.data
  ) {

    console.error(
      "Brand error:",
      brandResult.error
    );


    brandName.textContent =
      "برند پیدا نشد";


    brandDescription.textContent =
      "این برند در سایت موجود نیست.";


    productsGrid.innerHTML =
      '<div class="empty">برند پیدا نشد.</div>';


    return;

  }



  const brand =
    brandResult.data;



  /* -----------------------------
     نمایش اطلاعات برند
  ----------------------------- */

  brandName.textContent =
    brand.name;


  brandDescription.textContent =
    brand.description ||
    "محصولات برند " +
    brand.name;



  /* لوگوی برند */

  if (brand.logo_url) {

    brandLogo.src =
      brand.logo_url;

  }


  brandLogo.alt =
    brand.name;



  /* -----------------------------
     دریافت محصولات همین برند
  ----------------------------- */

  const productsResult =
    await SB

      .from("products")

      .select("*")

      .eq("brand_id", brand.id)

      .eq("active", true)

      .order("created_at", {
        ascending: false
      });



  if (productsResult.error) {

    console.error(
      "Products error:",
      productsResult.error
    );


    productsGrid.innerHTML =
      '<div class="empty">خطا در دریافت محصولات.</div>';


    return;

  }



  const products =
    productsResult.data || [];



  /* -----------------------------
     اگر محصولی وجود نداشت
  ----------------------------- */

  if (!products.length) {

    productsGrid.innerHTML =

      `<div class="empty">

        هنوز محصولی برای برند
        <strong>
          ${esc(brand.name)}
        </strong>
        ثبت نشده است.

      </div>`;

    return;

  }



  /* -----------------------------
     نمایش محصولات
  ----------------------------- */

  productsGrid.innerHTML =

    products.map(product => {


      const image =

        product.image_url ||
        "../assets/store-banner.png";


      return `

        <article class="product">


          <div class="product-image">

            <img

              src="${esc(image)}"

              alt="${esc(
                product.name ||
                brand.name
              )}"

              loading="lazy"

            >


            <span class="badge">

              ${esc(
                product.category ||
                "باتری"
              )}

            </span>

          </div>



          <div class="product-body">


            <h3>

              ${esc(
                brand.name
              )}

            </h3>


            <b>

              ${esc(
                product.name ||
                "محصول"
              )}

            </b>


            <p>

              ${esc(

                product.description ||

                "اطلاعات این محصول توسط مدیریت ثبت شده است."

              )}

            </p>



            <div class="meta">


              <span class="amp">

                ⚡

                ${esc(
                  product.amperage ||
                  "—"
                )}

              </span>


              <span class="price">

                ${money(
                  product.price
                )}

              </span>


            </div>


          </div>


        </article>

      `;

    }).join("");

}



/* -----------------------------
   سال فوتر
----------------------------- */

document.getElementById(
  "year"
).textContent =
  new Date().getFullYear();



/* -----------------------------
   اجرا
----------------------------- */

loadBrand();

</script>
